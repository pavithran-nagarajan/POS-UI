<button
  [type]="type"
  [disabled]="disabled"
  [class]="'btn btn-' + variant"
  (click)="handleClick($event)">
  @if (icon && iconPosition === 'left') {
    <i class="bi" [ngClass]="icon"></i>
  }
  {{ name }}
  @if (icon && iconPosition === 'right') {
    <i class="bi" [ngClass]="icon"></i>
  }
</button>
