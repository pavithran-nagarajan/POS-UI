<aside class="app-sidebar bg-body-secondary shadow" data-bs-theme="dark">
  <div class="sidebar-brand">
    <a class="brand-link">
      <span class="brand-text fw-light">AdminLTE 4</span>
      <button type="button" class="sidebar-close-btn d-md-none" (click)="closeSidebar()" aria-label="Close sidebar">
        <i class="bi bi-x-lg"></i>
      </button>
    </a>
  </div>

  <div class="sidebar-search" role="search">
    <label for="sidebar-search-input" class="visually-hidden">Filter menu</label>
    <input type="search" id="sidebar-search-input" class="form-control form-control-sm" placeholder="Filter menu…"
      autocomplete="off" data-lte-toggle="sidebar-search" data-lte-target="#navigation" />
    <p class="fs-7 text-secondary mt-2 mb-0" data-lte-search-empty role="status" hidden>No matching pages.</p>
  </div>

  <div class="sidebar-wrapper">
    <nav class="mt-2" aria-label="Main navigation">
      <ul class="nav sidebar-menu flex-column" data-lte-toggle="treeview" data-accordion="false" id="navigation">
        <ng-container *ngTemplateOutlet="menuList; context: { $implicit: menuItems }"></ng-container>
      </ul>

      <ng-template #menuList let-items>
        <ng-container *ngFor="let item of items">
          <li *ngIf="item.header" class="nav-header">{{ item.label }}</li>

          <li *ngIf="!item.header" class="nav-item" [class.menu-open]="item.open">
            <a [href]="item.link || '#'" class="nav-link" [class.active]="item.active">
              <i class="nav-icon bi" [ngClass]="item.icon"></i>
              <p>
                {{ item.label }}
                <span *ngIf="item.badge" class="nav-badge badge text-bg-secondary me-3">{{ item.badge }}</span>
                <i *ngIf="item.children?.length" class="nav-arrow bi bi-chevron-right"></i>
              </p>
            </a>
            <ul *ngIf="item.children?.length" class="nav nav-treeview">
              <ng-container *ngTemplateOutlet="menuList; context: { $implicit: item.children }"></ng-container>
            </ul>
          </li>
        </ng-container>
      </ng-template>
    </nav>
  </div>
</aside>
