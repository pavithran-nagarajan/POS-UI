<div class="grid-toolbar">
  <div class="search-box"> <i class="bi bi-search search-icon"></i>
    <input type="text" placeholder="Search" (input)="onQuickFilterChanged($event)" />
  </div>
</div>
<ag-grid-angular style="width: 100%;" [theme]="theme" [domLayout]="'autoHeight'" [columnDefs]="columnDefs"
  [defaultColDef]="defaultColDef" [pagination]="true" [paginationPageSize]="10"
  [paginationPageSizeSelector]="[10, 20, 50, 100]" [rowData]="rowData" (gridReady)="onGridReady($event)" />
