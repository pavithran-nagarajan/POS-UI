name: pos.admin.ui CI

on:
  push:
    branches: [ main ]
    paths:
      - 'pos.admin.ui/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'pos.admin.ui/**'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pos.admin.ui

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: 'npm'
          cache-dependency-path: pos.admin.ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test -- --watch=false

      - name: Build
        run: npm run build